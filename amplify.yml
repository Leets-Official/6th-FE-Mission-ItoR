version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - cd my-blog-app
        - pnpm install
    build:
      commands:
        - cd my-blog-app
        - pnpm run build
  artifacts:
    baseDirectory: my-blog-app/dist
    files:
      - '**/*'
  cache:
    paths:
      - my-blog-app/node_modules/**/*
