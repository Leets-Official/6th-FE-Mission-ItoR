version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --prefix my-blog-app
    build:
      commands:
        - pnpm run build --prefix my-blog-app
  artifacts:
    baseDirectory: my-blog-app/dist
    files:
      - '**/*'
  cache:
    paths:
      - my-blog-app/node_modules/**/*
