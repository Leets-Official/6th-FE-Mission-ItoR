<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitlog Blog</title>
    <meta
      name="description"
      content="개발자들을 위한 블로그 플랫폼. 마크다운 에디터로 손쉽게 기술 블로그를 작성하고 공유하세요."
    />
    <!-- Open Graph 기본 태그 -->
    <meta property="og:title" content="Gitlog Blog" />
    <meta
      property="og:description"
      content="개발자들을 위한 블로그 플랫폼. 마크다운 에디터로 손쉽게 기술 블로그를 작성하고 공유하세요."
    />
    <!-- TODO: 실제 배포 도메인으로 변경하세요 -->
    <meta property="og:url" content="https://gitlog.store" />
    <meta property="og:type" content="website" />
    <!-- OG 이미지 (public/logo-og.png 로 복사해서 사용 권장) -->
    <meta property="og:image" content="https://gitlog.store/logo-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta name="robots" content="index, follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Smooch&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/android-chrome-192x192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
